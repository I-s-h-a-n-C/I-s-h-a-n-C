name: Update profile stats

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'scripts/update_profile.py'
      - '.github/workflows/update-profile.yml'
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh age and GitHub stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_profile.py
      - name: Commit updated SVG files
        run: |
          if ! git diff --quiet -- light_mode.svg dark_mode.svg; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add light_mode.svg dark_mode.svg
            git commit -m 'Update profile statistics'
            git push
          fi
